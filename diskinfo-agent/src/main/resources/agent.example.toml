# CocoaDiskInfo agent example configuration.
# Priority: default < config file < environment variables < CLI arguments.

[smartctl]
scan = true
# device = "/dev/sda"

[deviceIdentity]
# Not secret. Changing this changes derived device keys and splits history identity.
namespaceSalt = "default"

[runtime]
intervalSeconds = 60
persist = false

[storage]
jdbcUrl = "jdbc:sqlite:./sapphire.db"

[http]
host = "127.0.0.1"
port = 14631

[output]
mode = "text"
